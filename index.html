<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>노래책</title>
<link rel="stylesheet" href="style.css?v=14">
</head>
<body>
<div class="wrap">
  <h1>🎤 노래책</h1>
  <p class="subtitle">제목이나 가수명으로 검색해보세요</p>
  <input type="text" id="search" class="search-box" placeholder="검색..." autocomplete="off">
  <div class="tag-tabs" id="tag-tabs">
    <button class="tag-tab active" data-tag="">전체</button>
    <button class="tag-tab" data-tag="한식">한식</button>
    <button class="tag-tab" data-tag="일식">일식</button>
    <button class="tag-tab" data-tag="양식">양식</button>
  </div>
  <p class="count" id="count"></p>
  <ul class="song-list" id="song-list"></ul>
  <a class="admin-link" href="admin.html">관리자</a>
</div>
<script src="script.js?v=4"></script>
</body>
</html>
