<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>노래책</title>
<link rel="stylesheet" href="style.css?v=56">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<meta name="theme-color" content="#ff6fa5">
</head>
<body>

<button id="admin-tools-btn" class="header-icon-btn" title="관리자 도구">⚙️</button>

<div class="wrap" id="view-mode">
  <div class="sticky-header">
    <div class="page-header">
      <h1>🎤 노래책</h1>
      <button id="quick-add-btn" class="fab">+</button>
    </div>
    <div class="search-row">
      <input type="text" id="search" class="search-box" placeholder="가수 또는 제목 검색..." autocomplete="off">
      <div id="sort-select" class="sort-select"></div>
    </div>
    <div class="tag-tabs" id="tag-tabs">
      <button class="tag-tab active" data-tag="">전체<span class="tag-count"></span></button>
      <button class="tag-tab" data-tag="한식">한식<span class="tag-count"></span></button>
      <button class="tag-tab" data-tag="일식">일식<span class="tag-count"></span></button>
      <button class="tag-tab" data-tag="양식">양식<span class="tag-count"></span></button>
    </div>
  </div>

  <div class="toolbar">
    <button id="view-select-all-btn">전체 선택</button>
    <button id="view-delete-selected-btn" class="danger">선택 삭제</button>
  </div>
  <ul class="song-list" id="song-list"></ul>
</div>

<div id="admin-tools" class="modal-overlay" hidden>
  <div class="modal-card">
    <h2 class="modal-title">관리자 도구</h2>

    <div class="bg-color-row">
      <label for="bg-color-input">배경색</label>
      <input type="color" id="bg-color-input" value="#14151a">
      <p class="status" id="bg-color-status"></p>
    </div>

    <div class="bg-color-row">
      <label for="song-bg-color-input">노래 칸 배경색</label>
      <input type="color" id="song-bg-color-input" value="#1e2027">
      <p class="status" id="song-bg-color-status"></p>
    </div>

    <details class="settings" id="settings-box">
      <summary>GitHub 연동 설정</summary>
      <div class="settings-grid">
        <label>계정/조직명<input type="text" id="cfg-owner" placeholder="예: mystream"></label>
        <label>저장소 이름<input type="text" id="cfg-repo" placeholder="예: 노래책"></label>
        <label>브랜치<input type="text" id="cfg-branch" placeholder="main"></label>
        <label>토큰 (Fine-grained PAT)<input type="password" id="cfg-token" placeholder="github_pat_..."></label>
      </div>
      <button id="save-cfg-btn">설정 저장</button>
      <p class="status" id="cfg-status"></p>
    </details>

    <div class="toolbar">
      <button id="github-save-btn" class="primary">GitHub에 저장</button>
      <button id="excel-import-btn">엑셀로 곡 추가</button>
      <button id="export-btn">JSON 내보내기</button>
      <button id="import-btn">JSON 불러오기</button>
      <button id="reset-btn">songs.json에서 다시 불러오기</button>
      <input type="file" id="import-file" accept="application/json" style="display:none">
      <input type="file" id="excel-import-file" accept=".xlsx,.xls" style="display:none">
    </div>

    <p class="status" id="status"></p>

    <div class="modal-actions">
      <button id="admin-tools-close-btn">닫기</button>
    </div>
  </div>
</div>

<div id="confirm-modal" class="modal-overlay" hidden>
  <div class="modal-card">
    <p class="confirm-message" id="confirm-message"></p>
    <div class="modal-actions">
      <button class="danger" id="confirm-ok-btn">삭제</button>
      <button id="confirm-cancel-btn">취소</button>
    </div>
  </div>
</div>

<div id="quick-add-modal" class="modal-overlay" hidden>
  <div class="modal-card">
    <h2 class="modal-title" id="qa-modal-title">곡 추가</h2>
    <div class="quick-add-grid">
      <div class="quick-add-row-cols">
        <label class="quick-add-field">
          <span class="field-label">제목</span>
          <input type="text" id="qa-title" placeholder="제목">
        </label>
        <label class="quick-add-field">
          <span class="field-label">가수</span>
          <input type="text" id="qa-artist" placeholder="가수">
        </label>
      </div>
      <div class="quick-add-row-cols quick-add-row-cols-3">
        <div class="quick-add-field">
          <span class="field-label">장르</span>
          <div id="qa-tags" class="sort-select"></div>
        </div>
        <div class="quick-add-field">
          <span class="field-label">숙련도</span>
          <div id="qa-diff"></div>
        </div>
        <label class="quick-add-field">
          <span class="field-label">비고</span>
          <input type="text" id="qa-notes" placeholder="비고 (쉼표로 여러개)">
        </label>
      </div>
    </div>
    <div class="modal-actions">
      <button class="primary" id="qa-submit-btn">저장</button>
      <button id="qa-cancel-btn">취소</button>
    </div>
    <p class="status" id="qa-status"></p>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="script.js?v=28"></script>
</body>
</html>
