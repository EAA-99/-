<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>노래책</title>
<link rel="stylesheet" href="style.css?v=41">
</head>
<body>

<div class="wrap">
  <div class="sticky-header">
    <div class="page-header">
      <h1>🎤 노래책</h1>
    </div>
    <div class="search-row">
      <input type="text" id="search" class="search-box" placeholder="가수 또는 제목 검색..." autocomplete="off">
      <div id="sort-select" class="sort-select"></div>
    </div>
    <div class="tag-tabs" id="tag-tabs">
      <button class="tag-tab active" data-tag="">전체<span class="tag-count"></span></button>
      <button class="tag-tab" data-tag="한식">한식<span class="tag-count"></span></button>
      <button class="tag-tab" data-tag="일식">일식<span class="tag-count"></span></button>
      <button class="tag-tab" data-tag="양식">양식<span class="tag-count"></span></button>
      <button class="tag-tab" data-tag="__favorites__">즐겨찾기<span class="tag-count"></span></button>
    </div>
  </div>
  <p class="count" id="count"></p>
  <ul class="song-list" id="song-list"></ul>
</div>

<script src="view.js?v=7"></script>
</body>
</html>
