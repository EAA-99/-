<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>노래책</title>
<link rel="stylesheet" href="style.css?v=31">
</head>
<body>

<div class="wrap">
  <div class="page-header">
    <h1>🎤 노래책</h1>
  </div>
  <div class="search-row">
    <input type="text" id="search" class="search-box" placeholder="가수 또는 제목 검색..." autocomplete="off">
    <select id="sort-select" class="sort-select">
      <option value="artist">가수이름순</option>
      <option value="difficulty">숙련도순</option>
      <option value="title">가나다순</option>
      <option value="recent">최근 등록순</option>
      <option value="likes">좋아요순</option>
    </select>
  </div>
  <div class="tag-tabs" id="tag-tabs">
    <button class="tag-tab active" data-tag="">전체</button>
    <button class="tag-tab" data-tag="한식">한식</button>
    <button class="tag-tab" data-tag="일식">일식</button>
    <button class="tag-tab" data-tag="양식">양식</button>
  </div>
  <p class="count" id="count"></p>
  <ul class="song-list" id="song-list"></ul>
</div>

<script src="view.js?v=3"></script>
</body>
</html>
